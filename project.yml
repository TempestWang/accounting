# XcodeGen 备用方案：如果手写 project.pbxproj 无法打开，
# 在 Mac 上执行：brew install xcodegen && xcodegen
name: Bookkeeping
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  developmentLanguage: "zh-Hans"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Bookkeeping:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Bookkeeping
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tempestwang.Bookkeeping
        INFOPLIST_FILE: BookkeepingInfo.plist
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "账本"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_PREVIEWS: YES
